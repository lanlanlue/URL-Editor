<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>URL Editor — Login</title>
    <link rel="icon" href="./static/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="login-card">
      <div class="login-brand">URL Editor <span>v2</span></div>
      <h1 data-i18n="login.title">登入 URL Editor</h1>
      <p data-i18n="login.desc">
        使用 Google 登入，跨裝置同步瀏覽器端加密的 URL 清單。
      </p>
      <div
        id="google-sign-in"
        class="google-sign-in"
        aria-label="Sign in with Google"
      ></div>
      <p
        id="login-status"
        class="login-status"
        role="status"
        aria-live="polite"
      ></p>
      <a class="login-local-link" href="/" data-i18n="login.continueLocal"
        >繼續使用訪客模式</a
      >
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
