# GitHub Action: CI (Continuous Integration)
# This workflow runs on every push and pull request to the main branch.
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run Worker API tests
        run: npm run test:worker

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run build
        run: npm run build

      - name: Run GitHub Pages build
        run: npm run build:gh

      - name: Check local bundle boundary
        run: npm run security:check -- local

      - name: Run Cloudflare build
        run: npm run build:cloud

      - name: Check cloud bundle boundary and secrets
        run: npm run security:check -- cloud

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage/
