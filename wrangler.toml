name = "url-editor"
compatibility_date = "2026-09-10"
main = "src/worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/", "/api", "/api/*", "/app", "/app/", "/login", "/login/"]

[[d1_databases]]
binding = "DB"
database_name = "url-editor"
database_id = "879bab3d-007f-4213-811f-951ee52cea81"
migrations_dir = "migrations"

[vars]
# The Google OAuth Client ID is public configuration. Set the production value
# in the Cloudflare Worker environment; never put a client secret here.
GOOGLE_CLIENT_ID = "523370321902-3fm83vlvm6s7vf2sv41b1a7vjp8o1hr4.apps.googleusercontent.com"
